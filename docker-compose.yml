name: mocmoc

services:
  web:
    build:
      context: ./fe
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://admin.mocmoc.vn}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://admin.mocmoc.vn}
    depends_on:
      api:
        condition: service_started
    expose:
      - "3000"

  api:
    build:
      context: ./be
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_ORIGIN: ${APP_ORIGIN:-https://mocmoc.vn,https://www.mocmoc.vn,https://admin.mocmoc.vn,http://localhost:3000}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      DB_HOST: ${DB_HOST:-36.50.27.243}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-default}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    expose:
      - "4000"
    volumes:
      - mocmoc_uploads:/app/uploads

volumes:
  mocmoc_uploads:
